# Reusable fragments for the four FastAPI app services (gateway/agent/corpus/
# ingestion). They share inter-service URLs (container DNS, which override any
# localhost values from ../.env) and bind-mount host source read-only so
# `uvicorn --reload` picks up edits with no image rebuild.
x-env-file: &env-file
  # Optional: provider keys can instead be exported in the shell (see x-app-env).
  - path: ../.env
    required: false
x-app-env: &app-env
  # cryptography's bundled OpenSSL (pulled in by litellm) uses SVE2 instructions
  # that SIGILL inside Docker Desktop's Apple-Virtualization VM, even though the
  # guest advertises sve2. Masking OpenSSL's ARM capability detection disables
  # those code paths. No-op on x86; only disables crypto accel on real arm64.
  OPENSSL_armcap: "0"
  CORPUS_SERVICE_URL: http://corpus:8001
  AGENT_SERVICE_URL: http://agent:8002
  INGESTION_SERVICE_URL: http://ingestion:8003
  MATH_VERIFIER_URL: http://math-verifier:8090
  QDRANT_URL: http://qdrant:6333
  TEI_EMBEDDER_URL: http://tei-embedder:8080
  LANGFUSE_HOST: http://langfuse:3000
  # The local MVP runs every role on one cheap model (see that file's header).
  MODEL_CONFIG_PATH: config/model_config.mvp.yaml
  # Bare names pass through from the shell when exported and stay unset otherwise,
  # so they never blank out a key from ../.env.
  OPENAI_API_KEY:
  OPENROUTER_API_KEY:
x-app-src: &app-src
  - ../services:/app/services:ro
  - ../shared:/app/shared:ro
  - ../config:/app/config:ro
  - ../prompts:/app/prompts:ro
  - ../seed:/app/seed:ro

services:
  # Postgres exists only for Langfuse, so both are opt-in (the chat path does not
  # need them): docker compose --profile observability up -d
  postgres:
    image: postgres:16-alpine
    profiles: [observability]
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu
      POSTGRES_DB: edu_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu -d edu_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # No healthcheck: the qdrant image ships no HTTP client (curl/wget/bash/nc
    # are all absent), so an in-container HTTP probe is impossible. Nothing in
    # this compose file depends_on qdrant health; readiness is gated at the app
    # layer (and via k8s readiness probes in Phase 2).

  langfuse:
    image: langfuse/langfuse:2
    profiles: [observability]
    environment:
      DATABASE_URL: postgresql://edu:edu@postgres:5432/edu_agent
      NEXTAUTH_SECRET: dev-secret-changeme
      NEXTAUTH_URL: http://localhost:3000
      SALT: dev-salt-changeme
      # Next.js standalone otherwise binds to the container hostname only; force
      # all interfaces so the port mapping and the in-container probe both reach it.
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # The langfuse image ships wget (not curl). Probe 127.0.0.1 (not localhost,
    # which resolves to IPv6 [::1] where nothing listens) with a GET, not --spider.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # BGE-M3 embedder via Hugging Face Text Embeddings Inference. Needed on the chat
  # path: the corpus service embeds every query and the seed job embeds the notes.
  #
  # The TEI CPU image is published amd64-only (no arm64 build on any tag), so on
  # Apple Silicon it runs under emulation via `platform: linux/amd64`. The first
  # start downloads the ~2GB model into the tei_cache volume, hence the long
  # start_period; later starts reuse the cache.
  tei-embedder:
    # cpu-1.9, not 1.4: 1.4's hf-hub client can no longer download models from an
    # empty cache ("relative URL without a base"), see the reranker below.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    platform: linux/amd64
    command: --model-id BAAI/bge-m3 --port 8080 --max-batch-tokens 2048
    ports:
      - "8080:8080"
    volumes:
      - tei_cache:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 900s

  # BGE-reranker-v2-m3 cross-encoder via Hugging Face Text Embeddings Inference,
  # exposing /rerank. Opt-in ("reranker" profile) and same platform as the embedder
  # (amd64-only, emulated on Apple Silicon). The corpus service only calls it
  # when TEI_RERANKER_URL is set (in ../.env: http://tei-reranker:8080 for
  # containers, http://localhost:8081 for a host-run corpus); if the service is
  # down, retrieval fails open to the RRF order.
  # cpu-1.9, not the embedder's cpu-1.4: 1.4's hf-hub client can no longer
  # download models from an empty cache ("relative URL without a base").
  # --max-batch-tokens 2048 also caps the (auto-truncated) input length; the
  # 8192-token default warmup is OOM-killed in an 8GB Docker VM, and a query
  # plus a ~400-token chunk fits easily.
  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    platform: linux/amd64
    profiles: [reranker]
    command: --model-id BAAI/bge-reranker-v2-m3 --port 8080 --max-batch-tokens 2048
    ports:
      - "8081:8080"
    volumes:
      - tei_reranker_cache:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Math verifier MCP server — SSE transport on port 8090.
  # The Agent Service connects to http://math-verifier:8090 via the verify-math Skill.
  # In k8s Phase 2, runs as a sidecar to the agent pod (cluster-internal, no external exposure).
  math-verifier:
    build:
      context: ..
      dockerfile: services/math_verifier/Dockerfile
    ports:
      - "8090:8090"
    environment:
      # Same SIGILL workaround as the app services (see x-app-env).
      OPENSSL_armcap: "0"
      MATH_VERIFIER_PORT: "8090"
    # FastMCP serves SSE at /sse (no /health route) and the python:3.12-slim base
    # has no curl — so probe the listening port with python, which is in the image.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 8090), timeout=2).close()\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Application services ────────────────────────────────────────────────────
  # Built from per-service Dockerfiles. Source is bind-mounted read-only and run
  # under `uvicorn --reload`, so routine code edits need no rebuild. Rebuild only
  # when dependencies change (pyproject.toml): `docker compose build`.
  # depends_on health-gates the startup order: qdrant → corpus/ingestion,
  # corpus+math-verifier → agent, agent+corpus → gateway.

  corpus:
    build:
      context: ..
      dockerfile: services/corpus/Dockerfile
    env_file: *env-file
    environment: *app-env
    volumes: *app-src
    ports:
      - "8001:8001"
    depends_on:
      qdrant:
        condition: service_started
    command: ["uvicorn", "services.corpus.src.corpus.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--reload-dir", "/app/services", "--reload-dir", "/app/shared"]

  ingestion:
    build:
      context: ..
      dockerfile: services/ingestion/Dockerfile
    env_file: *env-file
    environment: *app-env
    volumes: *app-src
    ports:
      - "8003:8003"
    depends_on:
      qdrant:
        condition: service_started
    command: ["uvicorn", "services.ingestion.src.ingestion.main:app", "--host", "0.0.0.0", "--port", "8003", "--reload", "--reload-dir", "/app/services", "--reload-dir", "/app/shared"]

  agent:
    build:
      context: ..
      dockerfile: services/agent/Dockerfile
    env_file: *env-file
    environment: *app-env
    volumes: *app-src
    ports:
      - "8002:8002"
    depends_on:
      corpus:
        condition: service_healthy
      math-verifier:
        condition: service_healthy
    command: ["uvicorn", "services.agent.src.agent.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload", "--reload-dir", "/app/services", "--reload-dir", "/app/shared"]

  # One-shot job: ingests seed/gre-quant/*.txt into the global corpus on first start
  # (no-op once the corpus holds points). `docker compose up` waits for it, so the
  # web app only comes up once there is something to retrieve.
  seed:
    build:
      context: ..
      dockerfile: services/ingestion/Dockerfile
    env_file: *env-file
    environment:
      <<: *app-env
      SEED_DIR: /app/seed
    volumes: *app-src
    restart: "no"
    depends_on:
      ingestion:
        condition: service_healthy
      tei-embedder:
        condition: service_healthy
    command: ["python", "-m", "services.ingestion.src.ingestion.seed"]

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    env_file: *env-file
    environment: *app-env
    volumes: *app-src
    ports:
      - "8000:8000"
    depends_on:
      agent:
        condition: service_healthy
      corpus:
        condition: service_healthy
    command: ["uvicorn", "services.gateway.src.gateway.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/services", "--reload-dir", "/app/shared"]

  # Static React build behind nginx, which proxies /chat to the gateway with
  # buffering off so the answer streams token by token.
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  postgres_data:
  qdrant_data:
  tei_cache:
  tei_reranker_cache:
