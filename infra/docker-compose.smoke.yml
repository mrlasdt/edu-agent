# CI smoke overlay (the `compose-smoke` job in .github/workflows/ci.yml):
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.smoke.yml ...
#
# The base file bind-mounts host source over each image and runs `uvicorn --reload`, which hides
# anything infra/assemble-service.sh forgot to ship. This overlay drops those mounts and the
# command, so each service starts from its image alone, so a missing source file or a root-owned
# path fails here before merge instead of on main.
services:
  corpus:
    volumes: !reset []
    command: !reset []
  ingestion:
    volumes: !reset []
    command: !reset []
  agent:
    volumes: !reset []
    command: !reset []
  gateway:
    volumes: !reset []
    command: !reset []
