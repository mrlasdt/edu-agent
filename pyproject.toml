[project]
name = "edu-agent"
version = "0.1.0"
description = "Multi-exam tutor (GRE Quant and AW chat, IELTS Writing mock) - agentic AI engineering reference implementation"
requires-python = ">=3.12"
# No runtime dependency lives here. Each service installs its own group below, so an image
# carries what that service imports and nothing else (infra/Dockerfile:
# `uv sync --frozen --no-default-groups --group <service>`). One lock covers every group.
dependencies = []

[dependency-groups]
# What every FastAPI service (gateway, agent, corpus, ingestion) imports. uvicorn[standard]
# brings watchfiles, which the compose `--reload` dev loop needs.
app = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0",
]
# The gateway and the agent both use the model stack through shared/ (llm_router, critics).
gateway = [
    {include-group = "app"},
    "litellm>=1.103.10",  # Router retry_policy / cooldown / pre-first-token fallback, as verified
    "langfuse>=2.30.0,<3",
]
agent = [
    {include-group = "app"},
    "litellm>=1.103.10",
    "langfuse>=2.30.0,<3",
]
corpus = [
    {include-group = "app"},
    "qdrant-client>=1.9.0",
]
ingestion = [
    {include-group = "app"},
    "qdrant-client>=1.9.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",  # FastAPI imports it at startup for the Form/UploadFile upload route
]
# Imports nothing third-party except the MCP server and the sympy sandbox; mcp brings
# uvicorn and starlette (the REST routes use starlette directly).
math-verifier = [
    "mcp>=1.0.0,<2",
    "starlette",
    "sympy>=1.12",
]
# The question-generation pipeline (question_pipeline/, ADR-0012): offline and eval-only, so no
# service image installs this group. It calls the math verifier through the agent's client, so it
# includes the agent group; sympy recomputes keys, langgraph runs the graph.
question-pipeline = [
    {include-group = "agent"},
    "langgraph>=1.0.0,<2",
    "sympy>=1.12",
]
# Local development, tests and evals: every service group plus what only they use.
# `uv sync` installs this group by default (default-groups below).
dev = [
    {include-group = "gateway"},
    {include-group = "agent"},
    {include-group = "corpus"},
    {include-group = "ingestion"},
    {include-group = "math-verifier"},
    {include-group = "question-pipeline"},
    "python-dotenv>=1.0.0",  # tests/test_observability.py
    "numpy>=1.26",  # evals.qdrant_filter_check (exact ground truth)
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."
