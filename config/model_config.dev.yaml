# Model configuration for the dev environment and the local MVP stack.
# Every role runs on gpt-4o-mini to keep spend low (a tutoring turn costs a fraction of
# a cent); a production setup would tier this (e.g. gpt-4o main, o1 math escalation).
# Each role specifies provider, model, and generation params.
# To swap a role to Anthropic: change provider to "anthropic" and model to e.g. "claude-sonnet-4-6".
# LiteLLM resolves provider+model at runtime.

roles:
  # Orchestrator — lightweight classify/enrich step before every turn
  orchestrator:
    provider: openai
    model: gpt-4o-mini
    temperature: 0

  # Main agents
  quant_agent:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.2

  aw_agent:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.5

  # Math verifier retry — same model as quant_agent
  math_retry:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.2

  # Math verifier escalation — ~1% of Quant turns; point at a reasoning-tier model when cost allows
  math_escalation:
    provider: openai
    model: gpt-4o-mini
    temperature: 1  # above math_retry so the last attempt is not a repeat of the failed ones

  # Post-generation critics
  style_critic:
    provider: openai
    model: gpt-4o-mini
    temperature: 0

  # AW eval judges
  aw_judge_nightly:
    provider: openai
    model: gpt-4o-mini
    temperature: 0

  aw_judge_pr:
    provider: openai
    model: gpt-4o-mini
    temperature: 0

  # Question-generation pipeline (LangGraph): planner and critic are cheap, the generator
  # experts are the main tier. Evals reroute every role to one model with write_model_config.
  question_planner:
    provider: openai
    model: gpt-4o-mini
    temperature: 0

  question_generator:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.4

  question_critic:
    provider: openai
    model: gpt-4o-mini
    temperature: 0

  # IELTS-style Writing mock: rubric grader (sampled three times, median per criterion) and the
  # examiner-style feedback writer. Both are gpt-4.1-mini: it is the model the development gate
  # in ADR-0014 was measured with, and gpt-4o-mini flagged correct text as errors in the
  # feedback. A mock costs a few cents. IELTS_MODEL_CHAIN overrides both roles.
  ielts_grader:
    provider: openai
    model: gpt-4.1-mini
    temperature: 0.3

  ielts_feedback:
    provider: openai
    model: gpt-4.1-mini
    temperature: 0.3

  # Background jobs
  style_extractor:
    provider: openai
    model: gpt-4o-mini
    temperature: 0

# Active prompt version per (agent, mode). Loaded by the agents at turn time and
# reported to Langfuse so quality/cost can be attributed to a specific version.
# To roll a prompt forward or A/B it: add prompts/<agent>/<mode>/vN.md and point here.
prompts:
  quant_agent:
    tutor: v2  # v1 plus "plain-text math": the web app does not render LaTeX
    solve: v2
  aw_agent:
    tutor: v1
    solve: v1
  # IELTS-style mock (prompts/<agent>/writing_t2/<version>.md)
  ielts_grader:
    writing_t2: v1
  ielts_feedback:
    writing_t2: v1
  # Question pipeline roles (prompts/question_pipeline/<role>/<version>.md)
  question_pipeline:
    planner: v1
    numeric_expert: v1
    choice_expert: v1
    comparison_expert: v1
    critic: v1
    baseline: v1
