# Paid OpenAI model configuration. Not the default any more: select it with
# MODEL_CONFIG_PATH=config/model_config.dev.yaml (the default is model_config.free.yaml).
# Every role runs on gpt-4o-mini to keep spend low (a tutoring turn costs a fraction of
# a cent); a production setup would tier this (e.g. gpt-4o main, o1 math escalation).
# Each role specifies provider, model, and generation params.
# To swap every default role to Anthropic: change provider to "anthropic" and model to e.g.
# "claude-sonnet-4-6" in the `default` anchor below (one edit); to swap one role, give it its own
# provider and model next to its temperature.
# LiteLLM resolves provider+model at runtime.
# The prompt versions are not here: they are shared by every config in config/prompt_pins.yaml.

# The (provider, model) pairs the roles share. A role takes one with `<<: *name` and adds its own
# temperature (and any other key, which wins over the anchor's).
models:
  default: &default
    provider: openai
    model: gpt-4o-mini
  # The IELTS roles run on gpt-4.1-mini, see the note on them below.
  ielts: &ielts
    provider: openai
    model: gpt-4.1-mini

roles:
  # Orchestrator — lightweight classify/enrich step before every turn
  orchestrator:
    <<: *default
    temperature: 0

  # Main agents
  quant_agent:
    <<: *default
    temperature: 0.2

  aw_agent:
    <<: *default
    temperature: 0.5

  # Folds the older turns of a long tutoring session into a short note: a cheap call, so point
  # it at a small model when cost matters (the note is a few hundred tokens in and out)
  context_summarizer:
    <<: *default
    temperature: 0

  # Math verifier retry — same model as quant_agent
  math_retry:
    <<: *default
    temperature: 0.2

  # Math verifier escalation — ~1% of Quant turns; point at a reasoning-tier model when cost allows
  math_escalation:
    <<: *default
    temperature: 1  # above math_retry so the last attempt is not a repeat of the failed ones

  # Post-generation critics
  style_critic:
    <<: *default
    temperature: 0

  # AW eval judges
  aw_judge_nightly:
    <<: *default
    temperature: 0

  aw_judge_pr:
    <<: *default
    temperature: 0

  # Question-generation pipeline (LangGraph): planner and critic are cheap, the generator
  # experts are the main tier. Evals reroute every role to one model with write_model_config.
  question_planner:
    <<: *default
    temperature: 0

  question_generator:
    <<: *default
    temperature: 0.4

  question_critic:
    <<: *default
    temperature: 0

  # IELTS Writing mock: rubric grader (sampled three times, median per criterion) and the
  # examiner-style feedback writer. Both are gpt-4.1-mini: it is the model the development gate
  # in ADR-0014 was measured with, and gpt-4o-mini flagged correct text as errors in the
  # feedback. A mock costs a few cents. Change the model here (or point MODEL_CONFIG_PATH at
  # another config) to mark with a different one.
  ielts_grader:
    <<: *ielts
    temperature: 0.3

  ielts_feedback:
    <<: *ielts
    temperature: 0.3

  # Background jobs
  style_extractor:
    <<: *default
    temperature: 0
