# Model configuration for the local MVP stack (infra/docker-compose.yml sets
# MODEL_CONFIG_PATH to this file). Every role runs on one cheap model so a full
# tutoring session costs cents; the tiering in model_config.dev.yaml (gpt-4o main,
# o1 escalation) is the intended production shape.
# To use OpenRouter instead: set provider to "openrouter", model to e.g.
# "openai/gpt-4o-mini" and pass OPENROUTER_API_KEY.

roles:
  # Orchestrator — lightweight classify/enrich step before every turn
  orchestrator:
    provider: openai
    model: gpt-4o-mini
    temperature: 0

  # Main agents
  quant_agent:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.2

  aw_agent:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.5

  # Math verifier retry — same model as quant_agent
  math_retry:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.2

  # Math verifier escalation — reasoning-tier model, ~1% of Quant turns
  math_escalation:
    provider: openai
    model: gpt-4o-mini
    temperature: 1  # o1 ignores temperature, but required by schema

  # Post-generation critics
  style_critic:
    provider: openai
    model: gpt-4o-mini
    temperature: 0

  # AW eval judges
  aw_judge_nightly:
    provider: openai
    model: gpt-4o-mini
    temperature: 0

  aw_judge_pr:
    provider: openai
    model: gpt-4o-mini
    temperature: 0

  # Question-generation pipeline (LangGraph): planner and critic are cheap, the generator
  # experts are the main tier. Evals reroute every role to one model with write_model_config.
  question_planner:
    provider: openai
    model: gpt-4o-mini
    temperature: 0

  question_generator:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.4

  question_critic:
    provider: openai
    model: gpt-4o-mini
    temperature: 0

  # Background jobs
  style_extractor:
    provider: openai
    model: gpt-4o-mini
    temperature: 0

# Active prompt version per (agent, mode). Loaded by the agents at turn time and
# reported to Langfuse so quality/cost can be attributed to a specific version.
# To roll a prompt forward or A/B it: add prompts/<agent>/<mode>/vN.md and point here.
prompts:
  quant_agent:
    tutor: v2  # v1 plus "plain-text math": the web app does not render LaTeX
    solve: v2
  aw_agent:
    tutor: v1
    solve: v1
  # Question pipeline roles (prompts/question_pipeline/<role>/<version>.md)
  question_pipeline:
    planner: v1
    numeric_expert: v1
    choice_expert: v1
    comparison_expert: v1
    critic: v1
    baseline: v1
