# Free-tier model configuration: every role except the two IELTS ones runs on ONE OpenRouter free
# model, so the whole stack (tutor, solve, guardrail checks, critics, graders) works with no
# OpenAI key and zero spend.
#
#   MODEL_CONFIG_PATH=config/model_config.free.yaml      (the default; needs only OPENROUTER_API_KEY)
#
# recursive/flint-v1.0:free was picked from OpenRouter's live model list (GET /api/v1/models):
# prompt and completion price are 0, and it supports tools, tool_choice, response_format and
# max_tokens. It is a reasoning model: it spends hidden thinking tokens before the visible answer,
# which is why the gateway's guardrail token caps sit well above the visible answer size.
# Free models are rate limited and come and go: google/gemma-4-31b-it:free (same capabilities)
# answered 429 for the whole proof run, so check the live list and swap the model in the
# `default` anchor below (ids that end in :free) if this one is gone. Free models are slow and
# say little about quality or latency; use this config for development and demos.
# The prompt versions are not here: they are shared by every config in config/prompt_pins.yaml.

# The (provider, model) pairs the roles share. A role takes one with `<<: *name` and adds its own
# temperature (and any other key, which wins over the anchor's).
models:
  default: &default
    provider: openrouter
    model: recursive/flint-v1.0:free
  # The IELTS roles, see the note on them below.
  ielts: &ielts
    provider: gemini
    model: gemma-4-26b-a4b-it
    fallbacks: [openrouter/google/gemma-4-26b-a4b-it:free, openrouter/google/gemma-4-31b-it:free]

roles:
  # Orchestrator - lightweight classify/enrich step before every turn
  orchestrator:
    <<: *default
    temperature: 0

  # Main agents
  quant_agent:
    <<: *default
    temperature: 0.2

  aw_agent:
    <<: *default
    temperature: 0.5

  # Folds the older turns of a long tutoring session into a short note: a cheap call, so point
  # it at a small model when cost matters (the note is a few hundred tokens in and out)
  context_summarizer:
    <<: *default
    temperature: 0

  # Math verifier retry - same model as quant_agent
  math_retry:
    <<: *default
    temperature: 0.2

  # Math verifier escalation (~1% of Quant turns)
  math_escalation:
    <<: *default
    temperature: 1  # above math_retry so the last attempt is not a repeat of the failed ones

  # Post-generation critics
  style_critic:
    <<: *default
    temperature: 0

  # AW eval judges
  aw_judge_nightly:
    <<: *default
    temperature: 0

  aw_judge_pr:
    <<: *default
    temperature: 0

  # Question-generation pipeline (LangGraph): planner and critic are cheap, the generator
  # experts are the main tier. Evals reroute every role to one model with write_model_config.
  question_planner:
    <<: *default
    temperature: 0

  question_generator:
    <<: *default
    temperature: 0.4

  question_critic:
    <<: *default
    temperature: 0

  # IELTS Writing mock: rubric grader and examiner-style feedback writer. These two roles are
  # the exception to the one-model rule: gemma-4-26b-a4b-it passed the ADR-0014 development gate
  # and flint did not (see the ADR's measured results). They run on Google AI Studio directly
  # (needs GEMINI_API_KEY). The LiteLLM Router (shared/src/shared/llm_router.py) retries Google's
  # transient 500/503 a couple of times, and with no key, or when Google is down, moves on to the
  # fallbacks in order: the same 26b and then 31b on OpenRouter's free tier (gemma-4-31b-it
  # passed the same gate).
  ielts_grader:
    <<: *ielts
    temperature: 0.3

  ielts_feedback:
    <<: *ielts
    temperature: 0.3

  # Background jobs
  style_extractor:
    <<: *default
    temperature: 0
