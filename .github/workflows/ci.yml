name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    name: Lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy services/ shared/ evals/ mcp_servers/ --ignore-missing-imports

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --extra dev
      - run: uv run pytest tests/ -q

  web:
    name: Web typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  audit-python:
    name: Dependency audit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: Export the locked dependency set
        run: uv export --frozen --no-hashes --no-emit-project --extra dev -o requirements-audit.txt
      - name: pip-audit against the OSV and PyPI advisory data
        # Fails on any known vulnerability in uv.lock. A finding with no fixed version yet can be
        # allowed with --ignore-vuln <ID> plus a comment here saying why and until when.
        run: uvx --from pip-audit==2.10.1 pip-audit -r requirements-audit.txt --no-deps --disable-pip

  audit-web:
    name: Dependency audit (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit at high severity (dev tooling included)
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the full git history
        run: ./gitleaks detect --source . --redact --no-banner --verbose

  eval-slice:
    name: Eval slice (path-gated)
    runs-on: ubuntu-latest
    # Only run when files that affect agent behaviour change. The path filter lives in the
    # `changes` job below. (`github.event.pull_request.changed_files` is a file count, not a
    # list of paths, so a `contains()` test on it is never true.)
    needs: changes
    if: needs.changes.outputs.eval-relevant == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --extra dev
      - name: Eval pipeline check (offline, fake model, no network, no secrets)
        # Exercises the real agent code path against a deterministic fake model. It proves
        # the harness (quant, aw and question-generation suites) works; it says nothing about model quality. Real runs are manual
        # (`--mode live`) and budget-capped; see README "Eval pipeline".
        run: uv run python -m evals.agent_eval --mode offline

  quant-suite-offline:
    name: Quant failure suite (offline plumbing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --extra dev
      - name: Failure-seeded Quant suite on a fake model
        # Proves the suite runs end to end: the real agent, rule graders, the real math verifier
        # on the hostile strings, pass@k / pass^k and the report. Scores nothing about a real
        # model. The live run is manual: .github/workflows/eval-live.yml.
        run: uv run python -m evals.agent_eval --mode offline --suite quant --samples 3

  # More precise path-gating via dorny/paths-filter
  changes:
    runs-on: ubuntu-latest
    outputs:
      eval-relevant: ${{ steps.filter.outputs.eval-relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            eval-relevant:
              - 'prompts/**'
              - 'services/agent/**'
              - 'services/gateway/**'
              - 'evals/**'
              - 'config/**'
