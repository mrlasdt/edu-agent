name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    name: Lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy services/ shared/ evals/ mcp_servers/ --ignore-missing-imports

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --extra dev
      - run: uv run pytest tests/ -q

  web:
    name: Web typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  eval-slice:
    name: Eval slice (path-gated)
    runs-on: ubuntu-latest
    # Only run when files that affect agent behaviour change
    if: |
      github.event_name == 'pull_request' && (
        contains(github.event.pull_request.changed_files, 'prompts/') ||
        contains(github.event.pull_request.changed_files, 'services/agent/') ||
        contains(github.event.pull_request.changed_files, 'services/gateway/') ||
        contains(github.event.pull_request.changed_files, 'evals/') ||
        contains(github.event.pull_request.changed_files, 'config/')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --extra dev
      - name: Eval pipeline check (offline, fake model, no network, no secrets)
        # Exercises the real agent code path against a deterministic fake model. It proves
        # the harness (quant, aw and question-generation suites) works; it says nothing about model quality. Real runs are manual
        # (`--mode live`) and budget-capped; see README "Eval pipeline".
        run: uv run python -m evals.agent_eval --mode offline

  # More precise path-gating via dorny/paths-filter
  changes:
    runs-on: ubuntu-latest
    outputs:
      eval-relevant: ${{ steps.filter.outputs.eval-relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            eval-relevant:
              - 'prompts/**'
              - 'services/agent/**'
              - 'services/gateway/**'
              - 'evals/**'
              - 'config/**'
