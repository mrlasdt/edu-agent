name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    name: Lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - run: uv run ruff check .
      - run: uv run mypy services/ shared/ evals/ mcp_servers/

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - run: uv run pytest tests/ -q

  web:
    name: Web typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      # `build` runs tsc first, so this is also the typecheck.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  audit-python:
    name: Dependency audit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
        with:
          sync: "false"
      - name: Export the locked dependency set
        run: uv export --frozen --no-hashes --no-emit-project --all-groups -o requirements-audit.txt
      - name: pip-audit against the OSV and PyPI advisory data
        # Fails on any known vulnerability in uv.lock. A finding with no fixed version yet can be
        # allowed with --ignore-vuln <ID> plus a comment here saying why and until when.
        run: uvx --from pip-audit==2.10.1 pip-audit -r requirements-audit.txt --no-deps --disable-pip

  audit-web:
    name: Dependency audit (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit at high severity (dev tooling included)
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the full git history
        run: ./gitleaks detect --source . --redact --no-banner --verbose

  eval-slice:
    name: Eval slice (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - name: Eval pipeline check (offline, fake model, no network, no secrets)
        # Exercises the real agent code path against a deterministic fake model. It proves
        # the harness (quant, aw and question-generation suites) works; it says nothing about model quality. Real runs are manual
        # (`--mode live`) and budget-capped; see README "Eval pipeline".
        run: uv run python -m evals.agent_eval --mode offline

  quant-suite-offline:
    name: Quant failure suite (offline plumbing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - name: Failure-seeded Quant suite on a fake model
        # Proves the suite runs end to end: the real agent, rule graders, the real math verifier
        # on the hostile strings, pass@k / pass^k and the report. Scores nothing about a real
        # model. The live run is manual: .github/workflows/eval-live.yml.
        run: uv run python -m evals.agent_eval --mode offline --suite quant --samples 3

  compose-smoke:
    name: Docker images build + start
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -f infra/docker-compose.yml -f infra/docker-compose.smoke.yml
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a dummy env file
        # No real key is needed: the services only start, they never call a model. Compose
        # requires .env (env_file); the ingestion admin key must be non-empty for the seed job.
        run: |
          cp .env.example .env
          sed -i 's/^INGESTION_ADMIN_KEY=$/INGESTION_ADMIN_KEY=ci-smoke-key/' .env
      - name: Build every image (the five services and the web app)
        run: $COMPOSE build
      - name: Start the stack and wait until every health check passes
        # Started: qdrant, math-verifier, corpus, ingestion, agent, gateway (each from its image,
        # no source mounts, see the overlay). Left out on purpose: `tei-embedder` (a ~2 GB model
        # download) and so `seed` and `web`, which wait on it; their images are still built above.
        run: $COMPOSE up --wait --wait-timeout 240 qdrant math-verifier corpus ingestion agent gateway
      - name: Import every module of each image with only its own dependency group
        # Starting a service imports its app, not what loads lazily. infra/import_smoke.py imports
        # all of a service's modules inside its image, so a package missing from the service's
        # group in pyproject.toml fails here as a ModuleNotFoundError.
        run: |
          for service in gateway agent corpus ingestion math-verifier; do
            echo "== $service"
            $COMPOSE run --rm --no-deps -T --entrypoint python "$service" - < infra/import_smoke.py
          done
      - name: Show service logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 80
      - name: Stop the stack
        if: always()
        run: $COMPOSE down --volumes
