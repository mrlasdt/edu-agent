name: Set up Python
description: >
  Install a pinned uv (with its download cache keyed on uv.lock) and sync the locked
  environment. Run actions/checkout first: a local action is read from the checked-out repo.

inputs:
  sync:
    description: "Run `uv sync` (the default `dev` group: every service group plus test and eval tools). Set to 'false' for jobs that only need the uv binary."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        # The one place the uv version is pinned. Bump it here, in a PR, so a new uv release
        # cannot change what CI runs on its own.
        version: "0.13.6"
        enable-cache: true
        cache-dependency-glob: uv.lock
    - if: inputs.sync == 'true'
      shell: bash
      run: uv sync
