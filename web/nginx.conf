server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # The gateway streams text/plain; buffering would hold the answer back until
    # it finished. Docker's embedded DNS makes `gateway` resolvable at startup.
    location /ielts/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # The X-Trace-Id response header of /chat is not hidden or rewritten here: nginx passes
    # upstream headers through, and the browser needs it to attach feedback to a reply.
    location /chat {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /feedback {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
